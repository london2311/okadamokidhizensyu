<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全集検索</title>
<style>
:root{
  --paper:#EDEFEA;
  --sumi:#191B18;
  --usu:#6E736B;
  --ai:#24425F;
  --shu:#C33B1E;
  --kei:#D3D7CE;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--sumi);
  font-family:var(--gothic);
  font-size:15px;line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 96px}

h1{
  font-family:var(--mincho);
  font-size:24px;font-weight:600;letter-spacing:.16em;
  margin:0 0 4px;
}
.lead{color:var(--usu);font-size:13px;margin:0 0 26px}

/* 背表紙の棚 */
.shelf{margin:0 0 22px}
.group{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.group-name{font-family:var(--mincho);font-size:14px;letter-spacing:.1em}
.group-toggle{
  border:0;background:none;color:var(--ai);cursor:pointer;
  font-family:var(--gothic);font-size:12px;padding:0;text-decoration:underline;
}
.spines{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 16px}
.spine{
  font-family:var(--mincho);font-size:13px;
  min-width:52px;padding:9px 6px 10px;
  border:1px solid var(--kei);border-radius:1px;
  background:#F7F8F4;color:var(--sumi);
  cursor:pointer;text-align:center;line-height:1.3;
}
.spine .n{display:block;font-size:10px;font-family:var(--gothic);color:var(--usu);margin-top:3px}
.spine[aria-pressed="false"]{background:transparent;color:#A9AEA5;border-style:dashed}
.spine[aria-pressed="false"] .n{color:#B7BBB3}
.spine:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

/* 検索欄 */
.search{border-top:2px solid var(--sumi);padding-top:14px}
.field{display:flex;gap:8px;align-items:stretch}
#q{
  flex:1;min-width:0;
  font-family:var(--mincho);font-size:19px;
  padding:12px 14px;
  border:1px solid var(--kei);border-radius:2px;background:#FBFCF9;color:var(--sumi);
}
#q:focus{outline:2px solid var(--ai);outline-offset:-1px;border-color:var(--ai)}
#go{
  font-family:var(--gothic);font-size:14px;
  padding:0 22px;border:1px solid var(--sumi);border-radius:2px;
  background:var(--sumi);color:var(--paper);cursor:pointer;
}
#go:hover{background:#000}
.opts{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:10px 0 0;font-size:13px;color:var(--usu)}
.opts label{cursor:pointer}
.status{margin:14px 0 0;font-size:13px;color:var(--usu);min-height:20px}

/* 結果 */
.hits{margin:26px 0 0;padding:0;list-style:none}
.hit{border-top:1px solid var(--kei);padding:16px 0}
.hit:first-child{border-top:2px solid var(--sumi)}
.hit-title{font-family:var(--mincho);font-size:17px;margin:0 0 3px;line-height:1.5}
.hit-src{font-size:12px;color:var(--usu);margin:0 0 9px}
.snippet{
  font-family:var(--mincho);font-size:15px;line-height:1.95;
  margin:0;max-width:70ch;
}
.full{
  font-family:var(--mincho);font-size:15px;line-height:2.0;
  margin:12px 0 0;max-width:70ch;white-space:pre-wrap;
  border-left:2px solid var(--kei);padding-left:14px;
}
mark{background:rgba(195,59,30,.16);color:var(--shu);padding:0 1px;border-radius:1px}
.acts{display:flex;gap:14px;margin:10px 0 0}
.acts button{
  border:0;background:none;padding:0;cursor:pointer;
  font-family:var(--gothic);font-size:13px;color:var(--ai);text-decoration:underline;
}
.acts button:hover{color:var(--shu)}
.empty{font-family:var(--mincho);font-size:16px;color:var(--usu);margin:34px 0 0}
@media (max-width:520px){
  .wrap{padding:20px 14px 80px}
  #q{font-size:17px}
  #go{padding:0 16px}
}
@media (prefers-reduced-motion:no-preference){
  .full{animation:open .18s ease-out}
  @keyframes open{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>全集検索</h1>
  <p class="lead">講話篇・著述篇・詩歌篇を横断して探し、必要な項だけを取り出します。</p>

  <div class="shelf" id="shelf"></div>

  <div class="search">
    <div class="field">
      <input id="q" type="search" placeholder="ことばを入れて検索" autocomplete="off" spellcheck="false">
      <button id="go">検索</button>
    </div>
    <div class="opts">
      <label><input type="radio" name="mode" value="body" checked> 本文をふくめて探す</label>
      <label><input type="radio" name="mode" value="title"> 見出しだけ探す</label>
      <span id="scope"></span>
    </div>
    <p class="status" id="status"></p>
  </div>

  <ul class="hits" id="hits"></ul>
</div>

<script>
const RUBY = /《[^》]*》/g;
const state = { man:null, sel:new Set(), cache:new Map(), busy:false };
const $ = s => document.querySelector(s);

// ---- 起動 ----
fetch('data/manifest.json')
  .then(r => r.json())
  .then(m => { state.man = m; m.volumes.forEach(v => state.sel.add(v.slug)); renderShelf(); updateScope(); })
  .catch(() => { $('#status').textContent = 'data/manifest.json が読めません。ファイルの場所を確認してください。'; });

function renderShelf(){
  const shelf = $('#shelf');
  const groups = [...new Set(state.man.volumes.map(v => v.group))];
  shelf.innerHTML = '';
  groups.forEach(g => {
    const vols = state.man.volumes.filter(v => v.group === g);
    const head = document.createElement('div');
    head.className = 'group';
    const name = document.createElement('span');
    name.className = 'group-name'; name.textContent = g;
    const tog = document.createElement('button');
    tog.className = 'group-toggle'; tog.textContent = 'まとめて切り替え';
    tog.onclick = () => {
      const on = vols.some(v => state.sel.has(v.slug));
      vols.forEach(v => on ? state.sel.delete(v.slug) : state.sel.add(v.slug));
      syncShelf(); updateScope();
    };
    head.append(name, tog);
    const row = document.createElement('div');
    row.className = 'spines';
    vols.forEach(v => {
      const b = document.createElement('button');
      b.className = 'spine'; b.dataset.slug = v.slug;
      b.setAttribute('aria-pressed', 'true');
      b.innerHTML = `${v.label}<span class="n">${v.count}項</span>`;
      b.onclick = () => {
        state.sel.has(v.slug) ? state.sel.delete(v.slug) : state.sel.add(v.slug);
        syncShelf(); updateScope();
      };
      row.append(b);
    });
    shelf.append(head, row);
  });
}
function syncShelf(){
  document.querySelectorAll('.spine').forEach(b =>
    b.setAttribute('aria-pressed', state.sel.has(b.dataset.slug) ? 'true' : 'false'));
}
function updateScope(){
  const vols = state.man.volumes.filter(v => state.sel.has(v.slug));
  const n = vols.reduce((a, v) => a + v.count, 0);
  $('#scope').textContent = vols.length
    ? `${vols.length}巻 ${n.toLocaleString()}項を対象`
    : '巻が選ばれていません';
}

// ---- 読み込みと解析 ----
async function load(slug){
  if (state.cache.has(slug)) return state.cache.get(slug);
  const txt = await (await fetch(`data/${slug}.txt`)).text();
  const recs = parse(txt, slug);
  state.cache.set(slug, recs);
  return recs;
}
function parse(txt, slug){
  const label = state.man.volumes.find(v => v.slug === slug).label;
  const out = [];
  const parts = txt.split(/^■■(.+?)■■[ \t]*$/m);
  for (let i = 1; i < parts.length; i += 2){
    const title = parts[i].trim();
    const lines = parts[i + 1].split('\n');
    let j = 0;
    while (j < lines.length && /^[─━\s]*$/.test(lines[j])) j++;
    const meta = [];
    while (j < lines.length && !/^─{5,}\s*$/.test(lines[j])){ meta.push(lines[j]); j++; }
    const body = lines.slice(j + 1).join('\n').replace(/^[─\s]+|[─\s]+$/g, '');
    out.push({ vol:label, title, src:meta.join(' ').trim(), body, flat:(title + '\n' + body).replace(RUBY, '') });
  }
  return out;
}

// ---- 検索 ----
$('#go').onclick = run;
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });

async function run(){
  if (state.busy) return;
  const terms = $('#q').value.trim().split(/[\s　]+/).filter(Boolean).map(t => t.normalize('NFKC').toLowerCase());
  const hits = $('#hits'); hits.innerHTML = '';
  if (!terms.length){ $('#status').textContent = '探すことばを入れてください。'; return; }
  const vols = state.man.volumes.filter(v => state.sel.has(v.slug));
  if (!vols.length){ $('#status').textContent = '巻を1つ以上選んでください。'; return; }

  state.busy = true; $('#go').disabled = true;
  const titleOnly = document.querySelector('input[name=mode]:checked').value === 'title';
  const found = [];
  for (let i = 0; i < vols.length; i++){
    $('#status').textContent = `${vols[i].label} を調べています（${i + 1}/${vols.length}）`;
    let recs;
    try { recs = await load(vols[i].slug); }
    catch { $('#status').textContent = `${vols[i].label} のデータが読めませんでした。`; continue; }
    for (const r of recs){
      const hay = (titleOnly ? r.title : r.flat).normalize('NFKC').toLowerCase();
      if (terms.every(t => hay.includes(t))) found.push(r);
    }
    await new Promise(r => setTimeout(r));
  }
  render(found, terms, titleOnly);
  state.busy = false; $('#go').disabled = false;
}

function render(found, terms, titleOnly){
  const hits = $('#hits');
  const cap = 200;
  $('#status').textContent = found.length
    ? `${found.length.toLocaleString()}件が見つかりました` + (found.length > cap ? `（先頭${cap}件を表示）` : '')
    : '';
  if (!found.length){
    hits.innerHTML = '<p class="empty">見つかりませんでした。ことばを短くするか、巻の選択を広げてみてください。</p>';
    return;
  }
  found.slice(0, cap).forEach(r => {
    const li = document.createElement('li'); li.className = 'hit';
    const h = document.createElement('p'); h.className = 'hit-title';
    h.innerHTML = mark(`${r.vol}　${r.title}`, terms);
    const s = document.createElement('p'); s.className = 'hit-src'; s.textContent = r.src;
    li.append(h, s);
    if (!titleOnly){
      const p = document.createElement('p'); p.className = 'snippet';
      p.innerHTML = mark(snippet(r.body.replace(RUBY, ''), terms), terms);
      li.append(p);
    }
    const acts = document.createElement('div'); acts.className = 'acts';
    const more = document.createElement('button'); more.textContent = '全文を開く';
    let box = null;
    more.onclick = () => {
      if (box){ box.remove(); box = null; more.textContent = '全文を開く'; return; }
      box = document.createElement('div'); box.className = 'full'; box.textContent = r.body;
      li.append(box); more.textContent = '全文を閉じる';
    };
    const copy = document.createElement('button'); copy.textContent = 'この項をコピー';
    copy.onclick = async () => {
      const text = `■■${r.title}■■\n${r.src}\n\n${r.body}`;
      try { await navigator.clipboard.writeText(text); copy.textContent = 'コピーしました'; }
      catch { copy.textContent = 'コピーできません'; }
      setTimeout(() => copy.textContent = 'この項をコピー', 1600);
    };
    acts.append(more, copy);
    li.append(acts);
    hits.append(li);
  });
}

function snippet(body, terms){
  const flat = body.replace(/\n+/g, ' ');
  const low = flat.normalize('NFKC').toLowerCase();
  let at = -1;
  for (const t of terms){ const i = low.indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; }
  if (at < 0) return flat.slice(0, 150) + (flat.length > 150 ? '…' : '');
  const from = Math.max(0, at - 70), to = Math.min(flat.length, at + 130);
  return (from ? '…' : '') + flat.slice(from, to) + (to < flat.length ? '…' : '');
}
function mark(text, terms){
  const esc = t => t.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  let out = esc(text);
  terms.forEach(t => {
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    out = out.replace(re, m => `<mark>${m}</mark>`);
  });
  return out;
}
</script>
</body>
</html>
